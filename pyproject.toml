[project]
name = "process-cli"
version = "0.1.0"
description = "CLI determinística pra gerenciar um kanban em Markdown puro (cards, épicos, WIP, trash)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
process = "process_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_cli"]

[dependency-groups]
dev = ["pytest>=8.0"]
