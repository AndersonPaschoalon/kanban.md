[project]
name = "kanban-md"
version = "0.1.0"
description = "CLI determinística pra gerenciar um kanban em Markdown puro (cards, épicos, WIP, trash)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
"kanban.md" = "kanban_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanban_md"]

[dependency-groups]
dev = ["pytest>=8.0"]
